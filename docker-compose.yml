services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lkp
      POSTGRES_PASSWORD: lkp_local_password
      POSTGRES_DB: lkp
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lkp -d lkp"]
      interval: 5s
      retries: 10
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: lkpminio
      MINIO_ROOT_PASSWORD: lkp_local_storage_password
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["storage_data:/data"]
volumes:
  postgres_data:
  storage_data:
